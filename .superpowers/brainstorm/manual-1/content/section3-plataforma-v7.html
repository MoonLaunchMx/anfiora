<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anfiora — Sección 3 v7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf7; --cream:#f4efe7; --surface:#ffffff;
    --ink:#1D1E20; --ink2:#585957; --muted:#9a9a96; --faint:#c4c2bb;
    --teal:#48C9B0; --teal-d:#0F6E56; --teal-deep:#0b4e3d;
    --mint:#eef9f5; --mint-2:#e2f4ec; --mint-bd:#cdebe1;
    --ok-bg:#e1f5ee; --ok-tx:#0F6E56; --pe-bg:#faeeda; --pe-tx:#854F0B; --no-bg:#fcebeb; --no-tx:#A32D2D;
    --line:#ebe6dd; --line2:#e0dbd1;
    --display:'Satoshi',sans-serif; --body:'General Sans',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg); color:var(--ink); font-family:var(--body); overflow-x:hidden; -webkit-font-smoothing:antialiased}

  .sec{position:relative; max-width:1120px; margin:0 auto; padding:60px 40px 50px}
  .sec::before{content:""; position:absolute; top:-40px; left:50%; transform:translateX(-50%);
    width:680px; height:300px; background:radial-gradient(60% 60% at 50% 0%, rgba(72,201,176,.10), transparent 70%); pointer-events:none}
  .head{position:relative; text-align:center; margin-bottom:24px}
  .kicker{display:inline-flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:var(--teal-d); font-weight:600; margin-bottom:13px}
  .kicker::before,.kicker::after{content:""; width:22px; height:1px; background:var(--mint-bd)}
  h2{font-family:var(--display); font-weight:700; font-size:clamp(27px,3.6vw,42px); line-height:1.1; letter-spacing:-.025em}
  h2 em{font-style:italic; font-weight:500; color:var(--teal-d)}

  .segwrap{display:flex; justify-content:center; margin:22px 0 34px}
  .seg{position:relative; display:inline-flex; padding:4px; gap:3px; background:var(--surface); border:1px solid var(--line); border-radius:100px; box-shadow:0 6px 20px rgba(27,28,30,.05)}
  .seg button{position:relative; z-index:1; cursor:pointer; border:none; background:none; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink2); padding:9px 24px; border-radius:100px; transition:color .3s; white-space:nowrap}
  .seg button.active{color:var(--teal-deep)}
  .seg .pill{position:absolute; z-index:0; top:4px; bottom:4px; border-radius:100px; background:var(--mint-2); transition:left .4s cubic-bezier(.22,1,.36,1), width .4s cubic-bezier(.22,1,.36,1)}

  .studio{display:grid; grid-template-columns:272px 1fr; gap:34px; align-items:center}
  .list{display:flex; flex-direction:column; gap:4px}
  .item{display:flex; align-items:center; gap:13px; cursor:pointer; padding:12px 14px; border-radius:14px; border:1px solid transparent; transition:.25s; position:relative}
  .item:hover{background:#fff}
  .item .ic{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; background:var(--mint); color:var(--teal-d); box-shadow:inset 0 0 0 1px var(--mint-bd); transition:.3s; flex-shrink:0}
  .item .nm{font-size:14.5px; font-weight:600; color:var(--ink2); transition:color .3s}
  .item .bd{margin-left:auto; font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--teal-d); background:var(--mint-2); border:1px solid var(--mint-bd); padding:3px 8px; border-radius:100px}
  .item.active{background:linear-gradient(120deg,#fff,var(--mint)); border-color:var(--mint-bd); box-shadow:0 10px 26px rgba(15,110,86,.10)}
  .item.active .ic{background:#fff; color:var(--teal-d); box-shadow:inset 0 0 0 1px var(--mint-bd), 0 5px 14px rgba(72,201,176,.2)}
  .item.active .nm{color:var(--ink)}

  .detail{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; min-height:400px; text-align:center}
  .screen{display:grid; place-items:center; min-height:280px}
  .ddesc{font-size:16px; line-height:1.6; color:var(--ink2); max-width:420px}

  .icn{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ===== invitados (3 estados) ===== */
  .phone{width:186px; height:344px; border-radius:30px; background:#fff; border:1px solid var(--line); box-shadow:0 20px 48px rgba(27,28,30,.14); padding:18px 14px; position:relative}
  .phone::before{content:""; position:absolute; top:10px; left:50%; transform:translateX(-50%); width:48px; height:5px; border-radius:5px; background:var(--line2)}
  .phead{font-family:var(--display); font-weight:600; font-size:13px; color:var(--ink); margin:14px 4px 12px}
  .prow{display:flex; align-items:center; gap:9px; padding:9px 8px; border-radius:11px; background:#faf9f6; margin-bottom:8px; opacity:0; animation:cbin .5s forwards}
  .prow:nth-child(2){animation-delay:.15s}.prow:nth-child(3){animation-delay:.3s}.prow:nth-child(4){animation-delay:.45s}.prow:nth-child(5){animation-delay:.6s}
  .prow .av{width:26px; height:26px; border-radius:50%; flex-shrink:0}
  .prow .tt{font-size:11.5px; font-weight:600; color:var(--ink)}
  .stat{margin-left:auto; font-size:9px; font-weight:700; padding:4px 9px; border-radius:100px; white-space:nowrap}
  .stat.ok{background:var(--ok-bg);color:var(--ok-tx)} .stat.pe{background:var(--pe-bg);color:var(--pe-tx)} .stat.no{background:var(--no-bg);color:var(--no-tx)}
  @keyframes cbin{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:translateY(0)}}

  /* ===== QR ===== */
  .qrwrap{position:relative; width:158px; height:158px; border-radius:18px; background:#fff; border:1px solid var(--line); box-shadow:0 16px 40px rgba(27,28,30,.12); padding:16px; overflow:hidden}
  .qrgrid{width:100%; height:100%; display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(7,1fr); gap:3px}
  .qrgrid span{background:var(--ink); border-radius:2px}
  .scanline{position:absolute; left:10px; right:10px; height:2px; background:linear-gradient(90deg,transparent,var(--teal),transparent); box-shadow:0 0 12px var(--teal); top:14px; animation:scan 2.6s ease-in-out infinite}
  @keyframes scan{0%{top:14px}50%{top:140px}100%{top:14px}}
  .qrok{position:absolute; inset:0; display:grid; place-items:center; background:rgba(238,249,245,.86); opacity:0; animation:qrok 2.6s ease-in-out infinite}
  .qrok div{width:44px;height:44px;border-radius:50%;background:var(--teal);display:grid;place-items:center}
  .qrok svg{width:22px;height:22px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  @keyframes qrok{0%,70%{opacity:0}82%,96%{opacity:1}100%{opacity:0}}

  /* ===== album ===== */
  .album{width:300px; overflow:hidden; border-radius:14px; -webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent); mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .album-track{display:flex; gap:10px; animation:track 9s linear infinite}
  .ph{width:120px; height:150px; border-radius:12px; flex-shrink:0; box-shadow:0 8px 20px rgba(27,28,30,.1)}
  .ph:nth-child(odd){background:linear-gradient(135deg,#f5d6c6,#e7a98e)} .ph:nth-child(even){background:linear-gradient(135deg,#cfeee5,#8fd3bf)}
  .ph:nth-child(3){background:linear-gradient(135deg,#d8ddf2,#a7b2e0)} .ph:nth-child(4){background:linear-gradient(135deg,#f3e2c0,#dcc081)}
  @keyframes track{0%{transform:translateX(0)}100%{transform:translateX(-390px)}}

  /* ===== playlist (canciones agregándose) ===== */
  .plcard{width:296px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 18px 40px rgba(27,28,30,.12)}
  .plhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .plhead .t{font-family:var(--display); font-weight:600; font-size:13.5px; color:var(--ink)}
  .plhead .c{font-size:10.5px; color:var(--muted)}
  .srow{display:flex; align-items:center; gap:11px; padding:7px 6px; border-radius:10px; opacity:0; transform:translateY(10px); animation:srin .5s forwards}
  .srow:nth-child(1){animation-delay:.1s}.srow:nth-child(2){animation-delay:.5s}.srow:nth-child(3){animation-delay:.9s}.srow:nth-child(4){animation-delay:1.3s}.srow:nth-child(5){animation-delay:1.7s}
  .srow .cov{width:34px; height:34px; border-radius:7px; flex-shrink:0; box-shadow:0 3px 8px rgba(27,28,30,.12)}
  .srow .meta{min-width:0; text-align:left}
  .srow .sn{font-size:12px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px}
  .srow .ar{font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px}
  .srow .add{margin-left:auto; width:20px; height:20px; border-radius:50%; background:#1DB954; display:grid; place-items:center; flex-shrink:0}
  .srow .add svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  @keyframes srin{to{opacity:1; transform:translateY(0)}}

  /* ===== acomodo de mesas (canvas) ===== */
  .canvas{position:relative; width:330px; height:248px; border-radius:18px; background:#fff;
    background-image:radial-gradient(rgba(27,28,30,.05) 1px, transparent 1px); background-size:16px 16px;
    border:1px solid var(--line); box-shadow:0 16px 40px rgba(27,28,30,.1); overflow:hidden}
  .cin{position:absolute; inset:0; animation:zoomout 1.1s cubic-bezier(.22,1,.36,1)}
  @keyframes zoomout{from{transform:scale(1.22); opacity:0}to{transform:scale(1); opacity:1}}
  .tbl{position:absolute; display:grid; place-items:center; font-size:9px; font-weight:700; color:var(--teal-d);
    background:var(--mint); border:1.5px solid var(--mint-bd); box-shadow:0 4px 10px rgba(27,28,30,.06)}
  .tbl.round{width:46px; height:46px; border-radius:50%}
  .tbl.square{width:46px; height:46px; border-radius:10px}
  .floor{position:absolute; display:grid; place-items:center; border-radius:10px; border:1.5px dashed var(--teal);
    background:rgba(72,201,176,.08); color:var(--teal-d); font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase}

  /* ===== presupuesto ===== */
  .fincard{width:286px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 16px 36px rgba(27,28,30,.11)}
  .finrow{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink2); margin-bottom:6px}
  .finrow b{color:var(--ink); font-family:var(--display)}
  .bar{height:10px; border-radius:6px; background:var(--mint-2); overflow:hidden; margin:6px 0 16px}
  .bar i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--teal),var(--teal-d)); width:10%; animation:fill 3s ease-in-out infinite}
  @keyframes fill{0%{width:8%}55%,100%{width:74%}}
  .fintag{font-size:11px; color:var(--teal-d); display:flex; align-items:center; gap:6px}
  .fintag .d{width:7px;height:7px;border-radius:50%;background:var(--teal); animation:bdot 1.4s infinite}
  @keyframes bdot{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* ===== proveedores ===== */
  .vlist{display:flex; flex-direction:column; gap:9px; width:270px}
  .vrow{display:flex; align-items:center; gap:11px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; box-shadow:0 8px 18px rgba(27,28,30,.06); opacity:0; animation:vin .6s forwards}
  .vrow:nth-child(1){animation-delay:.1s}.vrow:nth-child(2){animation-delay:.35s}.vrow:nth-child(3){animation-delay:.6s}
  .vrow .av{width:30px;height:30px;border-radius:9px;flex-shrink:0}
  .vrow .nm{font-size:12.5px;font-weight:600;color:var(--ink)}
  .vrow .stars{margin-left:auto; color:var(--teal); font-size:11px; letter-spacing:1px}
  @keyframes vin{from{opacity:0; transform:translateX(14px)}to{opacity:1; transform:translateX(0)}}

  /* ===== mesa de regalos (registry) ===== */
  .regcard{width:300px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 18px 40px rgba(27,28,30,.12)}
  .reghead{font-family:var(--display); font-weight:600; font-size:13.5px; color:var(--ink); margin-bottom:12px}
  .grow{display:flex; align-items:center; gap:11px; padding:9px 7px; border-radius:11px; opacity:0; animation:cbin .5s forwards}
  .grow:nth-child(2){animation-delay:.15s}.grow:nth-child(3){animation-delay:.3s}.grow:nth-child(4){animation-delay:.45s}
  .grow .sw{width:34px; height:34px; border-radius:9px; flex-shrink:0}
  .grow .gm{text-align:left; min-width:0}
  .grow .gn{font-size:12px; font-weight:600; color:var(--ink)}
  .grow .gp{font-size:10.5px; color:var(--muted)}
  .gst{margin-left:auto; font-size:9px; font-weight:700; padding:4px 9px; border-radius:100px; white-space:nowrap}
  .gst.res{background:var(--mint-2); color:var(--teal-d)}
  .gst.disp{background:#f3f1ec; color:var(--muted)}

  .react{max-width:1120px; margin:0 auto; padding:24px 40px 44px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .react .q{font-size:13px; color:var(--muted); margin-right:6px}
  .react button.rb{cursor:pointer; background:var(--surface); border:1px solid var(--line2); color:var(--ink2); padding:9px 16px; border-radius:10px; font-size:13px; font-family:inherit; transition:.3s}
  .react button.rb:hover{border-color:var(--teal); color:var(--teal-d)}

  @media(max-width:820px){
    .sec{padding:46px 18px 32px}
    .studio{display:flex; flex-direction:column; gap:22px}
    .detail{order:1; min-height:300px}
    .list{order:2; display:grid; grid-template-columns:1fr 1fr; gap:8px}
    .item{padding:11px 12px}
    .item .nm{font-size:13px}
    .seg button{padding:9px 16px; font-size:13px}
    .react{padding:24px 18px 40px; justify-content:center}
  }
  @media(max-width:380px){ .list{grid-template-columns:1fr} }
</style>
</head>
<body>
  <section class="sec">
    <div class="head">
      <div class="kicker">La plataforma</div>
      <h2>Para cada evento, <em>todo en su lugar</em>.</h2>
    </div>

    <div class="segwrap"><div class="seg" id="seg"><span class="pill" id="pill"></span></div></div>

    <div class="studio">
      <div class="list" id="list"></div>
      <div class="detail">
        <div class="screen" id="screen"></div>
        <p class="ddesc" id="cDesc">—</p>
      </div>
    </div>
  </section>

  <div class="react">
    <span class="q">¿Mejor mobile + animaciones nuevas (invitados, mesas, playlist, regalos)?</span>
    <button class="rb" onclick="toggleSelect && toggleSelect(this)">Sí, ya quedó</button>
    <button class="rb" onclick="toggleSelect && toggleSelect(this)">Ajustar una animación</button>
    <button class="rb" onclick="toggleSelect && toggleSelect(this)">Ajustar mobile</button>
    <button class="rb" onclick="toggleSelect && toggleSelect(this)">Otro detalle</button>
  </div>

<script>
  const CK='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  const PLUS='<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
  const I={
    users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-7"/>',
    photo:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
    music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    table:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',
    gift:'<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
    money:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    vendor:'<path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
  };
  const ANIM={
    confirm:()=>'<div class="phone"><div class="phead">Lista de invitados</div>'+
      '<div class="prow"><div class="av" style="background:linear-gradient(135deg,#cfeee5,#9ad9c7)"></div><div class="tt">Ana Martínez</div><span class="stat ok">Confirmado</span></div>'+
      '<div class="prow"><div class="av" style="background:linear-gradient(135deg,#f3e2c0,#dcc081)"></div><div class="tt">Carlos Ruiz</div><span class="stat pe">Pendiente</span></div>'+
      '<div class="prow"><div class="av" style="background:linear-gradient(135deg,#f5d6c6,#e7a98e)"></div><div class="tt">Sofía López</div><span class="stat no">Declinó</span></div>'+
      '<div class="prow"><div class="av" style="background:linear-gradient(135deg,#d8ddf2,#a7b2e0)"></div><div class="tt">Miguel Torres</div><span class="stat ok">Confirmado</span></div></div>',
    qr:()=>{let g='';for(let k=0;k<49;k++){g+=Math.random()>0.45?'<span></span>':'<span style="opacity:0"></span>';} return '<div class="qrwrap"><div class="qrgrid">'+g+'</div><div class="scanline"></div><div class="qrok"><div>'+CK+'</div></div></div>';},
    album:()=>'<div class="album"><div class="album-track"><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div></div></div>',
    playlist:()=>'<div class="plcard"><div class="plhead"><span class="t">Playlist del evento</span><span class="c">5 canciones</span></div>'+
      song('#1DB954','#0a8f3c','Die With A Smile','Lady Gaga, Bruno Mars')+
      song('#e7a98e','#c66b46','Beautiful Things','Benson Boone')+
      song('#a7b2e0','#5566b8','Espresso','Sabrina Carpenter')+
      song('#8fd3bf','#3f9f82','Birds of a Feather','Billie Eilish')+
      song('#dcc081','#b8923c','Sabor a Mí','Luis Miguel')+'</div>',
    mesas:()=>'<div class="canvas"><div class="cin">'+
      '<div class="tbl round" style="left:24px;top:22px">1</div>'+
      '<div class="tbl square" style="left:138px;top:18px">2</div>'+
      '<div class="tbl round" style="left:258px;top:30px">3</div>'+
      '<div class="floor" style="left:120px;top:100px;width:96px;height:48px">Pista</div>'+
      '<div class="tbl square" style="left:30px;top:150px">4</div>'+
      '<div class="tbl round" style="left:150px;top:178px">5</div>'+
      '<div class="tbl round" style="left:256px;top:160px">6</div></div></div>',
    finanzas:()=>'<div class="fincard"><div class="finrow"><span>Presupuesto</span><b>$248,000</b></div><div class="bar"><i></i></div><div class="finrow"><span>Pagado</span><b>$183,500</b></div><div class="fintag"><span class="d"></span>Se actualiza con cada pago</div></div>',
    proveedores:()=>'<div class="vlist"><div class="vrow"><div class="av" style="background:linear-gradient(135deg,#f5d6c6,#e7a98e)"></div><div class="nm">Banquetes del Valle</div><div class="stars">★★★★★</div></div><div class="vrow"><div class="av" style="background:linear-gradient(135deg,#cfeee5,#8fd3bf)"></div><div class="nm">Flores & Co.</div><div class="stars">★★★★☆</div></div><div class="vrow"><div class="av" style="background:linear-gradient(135deg,#d8ddf2,#a7b2e0)"></div><div class="nm">DJ Lumen</div><div class="stars">★★★★★</div></div></div>',
    regalos:()=>'<div class="regcard"><div class="reghead">Mesa de regalos</div>'+
      greg('linear-gradient(135deg,#cfeee5,#8fd3bf)','Juego de copas','$1,200','res','Reservado')+
      greg('linear-gradient(135deg,#f3e2c0,#dcc081)','Set de sábanas','$2,400','disp','Disponible')+
      greg('linear-gradient(135deg,#d8ddf2,#a7b2e0)','Cafetera Premium','$3,800','disp','Disponible')+'</div>',
  };
  function song(c1,c2,sn,ar){return '<div class="srow"><div class="cov" style="background:linear-gradient(135deg,'+c1+','+c2+')"></div><div class="meta"><div class="sn">'+sn+'</div><div class="ar">'+ar+'</div></div><div class="add">'+CK+'</div></div>';}
  function greg(sw,n,p,cls,lbl){return '<div class="grow"><div class="sw" style="background:'+sw+'"></div><div class="gm"><div class="gn">'+n+'</div><div class="gp">'+p+'</div></div><span class="gst '+cls+'">'+lbl+'</span></div>';}

  const M={
    invitados:{t:'Invitados', d:'Confirma, agrupa y da seguimiento a tu lista sin perseguir a nadie.', i:'users', a:'confirm'},
    checkin:{t:'Check-in con QR', d:'Genera un código QR y registra el acceso de cada invitado al llegar.', i:'qr', a:'qr', badge:'Pronto'},
    album:{t:'Álbum con QR', d:'Reúne las fotos de todos en un álbum, sin perderse en el chat.', i:'photo', a:'album'},
    playlist:{t:'Playlist', d:'Tus invitados sugieren las canciones y tú llegas con la lista lista.', i:'music', a:'playlist'},
    mesas:{t:'Acomodo de mesas', d:'Acomoda mesas, pista y lugares en un lienzo, arrastrando.', i:'table', a:'mesas'},
    regalos:{t:'Mesa de regalos', d:'Tu propia mesa, sin comisiones y sin regalos repetidos.', i:'gift', a:'regalos'},
    finanzas:{t:'Presupuesto y pagos', d:'Cada pago actualiza tu presupuesto al instante. Adiós Excel.', i:'money', a:'finanzas'},
    proveedores:{t:'Proveedores', d:'Cotizaciones, contratos y reseñas, cada proveedor en su lugar.', i:'vendor', a:'proveedores'},
  };
  const CATS=[
    {label:'Social', keys:['invitados','album','playlist','mesas','regalos','finanzas']},
    {label:'Corporativo', keys:['invitados','checkin','finanzas','proveedores']},
    {label:'Impacto', keys:['invitados','checkin','finanzas','proveedores','regalos']},
  ];

  const segEl=document.getElementById('seg'), pillEl=document.getElementById('pill'),
        listEl=document.getElementById('list'), screenEl=document.getElementById('screen'), cDesc=document.getElementById('cDesc');
  let cat=0, activeKey='invitados', segBtns=[];

  CATS.forEach((c,i)=>{
    const b=document.createElement('button'); b.className=i===0?'active':''; b.textContent=c.label;
    b.onclick=()=>{cat=i; if(!CATS[cat].keys.includes(activeKey)) activeKey=CATS[cat].keys[0]; render();};
    segEl.appendChild(b); segBtns.push(b);
  });
  function movePill(){ const b=segBtns[cat]; pillEl.style.left=b.offsetLeft+'px'; pillEl.style.width=b.offsetWidth+'px'; segBtns.forEach((x,i)=>x.className=i===cat?'active':''); }
  function paintScreen(){ const m=M[activeKey]; screenEl.innerHTML=''; void screenEl.offsetWidth; screenEl.innerHTML=ANIM[m.a](); cDesc.textContent=m.d; }
  function render(){
    movePill();
    listEl.innerHTML='';
    CATS[cat].keys.forEach(k=>{
      const m=M[k];
      const it=document.createElement('div'); it.className='item'+(k===activeKey?' active':'');
      it.innerHTML='<div class="ic"><svg class="icn" viewBox="0 0 24 24">'+I[m.i]+'</svg></div><span class="nm">'+m.t+'</span>'+(m.badge?'<span class="bd">'+m.badge+'</span>':'');
      it.onclick=()=>{ activeKey=k; render(); };
      it.onmouseenter=()=>{ if(window.innerWidth>820 && activeKey!==k){ activeKey=k; render(); } };
      listEl.appendChild(it);
    });
    paintScreen();
  }
  render();
  window.addEventListener('resize', movePill);
</script>
</body>
</html>
