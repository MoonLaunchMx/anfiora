name: Recordatorios

# De momento solo manual. El disparo cada 15 minutos se habilita despues de
# verificar en produccion (ver el plan de despliegue).
on:
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al cron de recordatorios
        # El dominio canonico es el www. anfiora.com responde 307 y curl no
        # reenvia la cabecera Authorization al saltar de host, asi que apuntar
        # al desnudo nunca ejecuta el cron. El codigo se comprueba a mano
        # porque --fail deja pasar los 3xx: el job salia verde sin haber
        # llamado a nada.
        run: |
          codigo=$(curl --silent --show-error --max-time 60 \
            -o respuesta.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.anfiora.com/api/cron/reminders)
          cat respuesta.json
          echo
          test "$codigo" = "200"
